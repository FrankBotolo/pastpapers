# Nginx config — sdmpropertys.com (Past Papers site)
# Copy to: /etc/nginx/sites-available/pastpapers
# Enable:  sudo ln -s /etc/nginx/sites-available/pastpapers /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name sdmpropertys.com www.sdmpropertys.com;

    root /var/www/pastpapers;
    index index.html;

    # Security headers (AdSense + SEO)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Main site
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets (CSS, JS, fonts, images, PDFs)
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}

# After SSL:
# sudo certbot --nginx -d sdmpropertys.com -d www.sdmpropertys.com
