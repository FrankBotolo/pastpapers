# Nginx config — sdmpropertys.com with HTTPS
# Use AFTER running certbot, or if you already have SSL certificates.
# Path: /etc/nginx/sites-available/pastpapers

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sdmpropertys.com www.sdmpropertys.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sdmpropertys.com www.sdmpropertys.com;

    root /var/www/pastpapers;
    index index.html;

    # Certbot sets these paths automatically — adjust if needed
    ssl_certificate     /etc/letsencrypt/live/sdmpropertys.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdmpropertys.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
